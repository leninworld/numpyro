name: Resolve initialization feedback dependencies
on:
  push:
    branches: [validate-initialization-feedback]
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Fetch exact public diagnostic packet
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/numpyro2384-packet"
          git -C "$RUNNER_TEMP/numpyro2384-packet" init --quiet
          timeout 60 git -C "$RUNNER_TEMP/numpyro2384-packet" fetch --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/numpyro2384-packet" checkout --detach --quiet FETCH_HEAD
          git -C "$RUNNER_TEMP/numpyro2384-packet" ls-tree -r --name-only HEAD > "$RUNNER_TEMP/actual-packet-paths"
          cat > "$RUNNER_TEMP/expected-packet-paths" <<'PATHS'
          .github/workflows/validate-initialization-feedback.yml
          .validation/numpyro2384/bootstrap.txt
          .validation/numpyro2384/constraints.txt
          .validation/numpyro2384/host.py
          .validation/numpyro2384/inside.py
          .validation/numpyro2384/manifest.json
          .validation/numpyro2384/pyproject.toml
          PATHS
          diff -u "$RUNNER_TEMP/expected-packet-paths" "$RUNNER_TEMP/actual-packet-paths"
      - name: Bounded Docker dependency closure
        run: python3 "$RUNNER_TEMP/numpyro2384-packet/.validation/numpyro2384/host.py"
      - name: Retain evidence and reusable public dependency cache
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: initialization-feedback-dependencies
          path: ${{ runner.temp }}/numpyro2384-closure/work/evidence
          if-no-files-found: error
          retention-days: 14
