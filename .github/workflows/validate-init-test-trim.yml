name: Initialization review test verification
on:
  push:
    branches: [validate-init-test-trim-5791938822]
permissions:
  contents: read
  actions: read
jobs:
  d0:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      origin: ${{ steps.origin.outputs.origin }}
    env:
      JOB_LABEL: d0
    steps:
      - name: Preserve actual whole-workflow origin
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at > "$RUNNER_TEMP/trim-origin.txt"
          python3 - <<'PYORIGIN' >> "$GITHUB_OUTPUT"
          import datetime,os,pathlib
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'trim-origin.txt').read_text().strip()
          print('origin='+str(int(datetime.datetime.fromisoformat(text.replace('Z','+00:00')).timestamp())))
          PYORIGIN
      - name: Fetch and verify sealed packet
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/trim-packet"
          git -C "$RUNNER_TEMP/trim-packet" init --quiet
          timeout 60 git -C "$RUNNER_TEMP/trim-packet" fetch --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/trim-packet" checkout --detach --quiet FETCH_HEAD
          cd "$RUNNER_TEMP/trim-packet"
          (cd .validation/init-test-trim && sha256sum --check SHA256SUMS)
          cmp .github/workflows/validate-init-test-trim.yml .validation/init-test-trim/workflow.yml
      - name: Tiny fixtures, lint, eight retained regressions and admission
        env:
          PACKET_ORIGIN: ${{ steps.origin.outputs.origin }}
        run: python3 "$RUNNER_TEMP/trim-packet/.validation/init-test-trim/host.py" d0
      - name: Retain exact owned evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: init-test-trim-d0
          path: ${{ runner.temp }}/init-test-trim-d0/evidence
          if-no-files-found: error
          retention-days: 14
  affected:
    needs: d0
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        label: [inference-auto-heavy, inference-auto-other, inference-other-rest, quality]
    env:
      JOB_LABEL: ${{ matrix.label }}
      PACKET_ORIGIN: ${{ needs.d0.outputs.origin }}
    steps:
      - name: Fetch and verify sealed packet
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/trim-packet"
          git -C "$RUNNER_TEMP/trim-packet" init --quiet
          timeout 60 git -C "$RUNNER_TEMP/trim-packet" fetch --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/trim-packet" checkout --detach --quiet FETCH_HEAD
          cd "$RUNNER_TEMP/trim-packet"
          (cd .validation/init-test-trim && sha256sum --check SHA256SUMS)
          cmp .github/workflows/validate-init-test-trim.yml .validation/init-test-trim/workflow.yml
      - name: Complete affected validation bundle
        run: python3 "$RUNNER_TEMP/trim-packet/.validation/init-test-trim/host.py" "$JOB_LABEL"
      - name: Retain exact owned evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: init-test-trim-${{ matrix.label }}
          path: ${{ runner.temp }}/init-test-trim-${{ matrix.label }}/evidence
          if-no-files-found: error
          retention-days: 14
